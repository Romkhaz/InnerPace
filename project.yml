name: InnerPace
options:
  bundleIdPrefix: com.romankhazeev
  createIntermediateGroups: true
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: A5M5K586RB
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  InnerPace:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "Services/Metronome.swift"
      - path: Shared
      - path: SharedAudio
      - path: SharedUI
      - path: SharedSensors
    dependencies:
      - target: InnerPaceWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: InnerPace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Нужен для подключения к пульсометру Polar H10.
        NSMotionUsageDescription: Шагомер нужен для фактического каденса и дистанции.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSHealthShareUsageDescription: Приложение на часах читает пульс, дистанцию и темп во время тренировки.
        NSHealthUpdateUsageDescription: Приложение на часах сохраняет тренировку в Здоровье.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/InnerPace.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romankhazeev.HeartRegulator
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  InnerPaceWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: SharedAudio
      - path: SharedUI
      - path: SharedSensors
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: InnerPace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.romankhazeev.HeartRegulator
        WKBackgroundModes: [workout-processing]
        UIBackgroundModes: [audio, location]
        NSHealthShareUsageDescription: Приложение читает пульс, дистанцию и темп во время тренировки.
        NSHealthUpdateUsageDescription: Приложение сохраняет пробежку в Здоровье.
        NSLocationWhenInUseUsageDescription: Нужно для дистанции, темпа и маршрута пробежки.
        NSMotionUsageDescription: Шагомер нужен для фактического каденса.
    entitlements:
      path: Watch/InnerPaceWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romankhazeev.HeartRegulator.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SharedLogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InnerPace:
    build:
      targets:
        InnerPace: all
    run:
      config: Debug
  InnerPaceWatch:
    build:
      targets:
        InnerPaceWatch: all
    run:
      config: Debug
  SharedLogicTests:
    build:
      targets:
        SharedLogicTests: all
    test:
      targets:
        - SharedLogicTests
